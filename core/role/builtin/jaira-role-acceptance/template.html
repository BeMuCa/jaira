<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sticky progress strip, block tabs, then per block: setup once, machine checks (already run), one scenario whose steps name the tickets they prove, and the ticket cards with their verdict. */
:root{
  --bg:#f3f5f7; --panel:#ffffff; --fg:#17202a; --muted:#5b6774; --line:#d9dfe5;
  --accent:#1f5f99; --ok:#1d7a45; --ok-bg:#e3f3ea; --fail:#b3261e; --fail-bg:#fbe7e5;
  --skip:#8a6d1a; --skip-bg:#f7f0dc; --code-bg:#eef2f6; --on-solid:#ffffff;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12171d; --panel:#1a2129; --fg:#e4e9ee; --muted:#9aa6b2; --line:#2c3743;
  --accent:#6fa8dc; --ok:#5cc489; --ok-bg:#16301f; --fail:#f08a80; --fail-bg:#3a1c1a;
  --skip:#d8b65a; --skip-bg:#33290f; --code-bg:#222b35; --on-solid:#12171d; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --panel:#1a2129; --fg:#e4e9ee; --muted:#9aa6b2; --line:#2c3743;
  --accent:#6fa8dc; --ok:#5cc489; --ok-bg:#16301f; --fail:#f08a80; --fail-bg:#3a1c1a;
  --skip:#d8b65a; --skip-bg:#33290f; --code-bg:#222b35; --on-solid:#12171d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--sans);margin:0}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:20px 60px}
h1{font-size:1.5rem;font-weight:600;margin:0;text-wrap:balance}
h2{font-size:1.15rem;font-weight:600;margin:0;text-wrap:balance}
h3{font-size:.8rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.sub{color:var(--muted);margin:4px 0 0;max-width:75ch}
code{font-family:var(--mono);font-size:.86em;background:var(--code-bg);padding:1px 4px;border-radius:3px;overflow-wrap:anywhere}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:6px;padding:4px 10px}
button:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.strip{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;border-bottom:1px solid var(--line);margin-bottom:16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.bar{flex:1 1 240px;height:8px;background:var(--line);border-radius:4px;overflow:hidden;display:flex;min-width:0}
.bar i{display:block;height:100%}
.counts{font-family:var(--mono);font-size:.85rem;font-variant-numeric:tabular-nums;display:flex;gap:12px;flex-wrap:wrap}
.status{font-size:.85rem;color:var(--muted)}
.warn{background:var(--skip-bg);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin-bottom:14px}
.blocks{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 8px}
.blocks button{display:flex;gap:8px;align-items:center;padding:6px 10px}
.blocks button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.bn{font-family:var(--mono);color:var(--accent);font-weight:500}
.bp{font-family:var(--mono);font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.blocks button[data-done="1"] .bp{color:var(--ok)}
.bhead{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:baseline;margin:22px 0 6px}
.hint{color:var(--muted);margin:0 0 6px;max-width:75ch}
.bdone{background:var(--ok-bg);border:1px solid var(--line);border-radius:6px;padding:8px 12px;margin:10px 0}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden}
ol.setup{margin:0;padding:10px 16px 10px 36px}
ol.setup li{margin:2px 0}
.mc{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;padding:8px 16px;border-bottom:1px solid var(--line);align-items:start}
.mc:last-child{border-bottom:0}
.mc details{grid-column:2 / 4}
.mc pre{margin:6px 0 0;padding:8px;background:var(--code-bg);border-radius:6px;font:12px/1.45 var(--mono);overflow-x:auto;max-height:240px}
.pill{font-family:var(--mono);font-size:.78rem;border-radius:4px;padding:1px 6px;white-space:nowrap}
.pill.pass{background:var(--ok-bg);color:var(--ok)}
.pill.fail{background:var(--fail-bg);color:var(--fail)}
.pill.pending{background:var(--code-bg);color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.chip{font-family:var(--mono);font-size:.76rem;color:var(--accent);border:1px solid var(--line);border-radius:4px;padding:0 5px;text-decoration:none}
ol.steps{list-style:none;margin:0;padding:0}
.step{display:grid;grid-template-columns:2.2em minmax(0,1fr) auto;gap:4px 10px;padding:10px 16px;border-bottom:1px solid var(--line);align-items:start}
.step:last-child{border-bottom:0}
.step[data-s="ok"]{background:var(--ok-bg)}
.step[data-s="fail"]{background:var(--fail-bg)}
.step[data-s="skip"]{background:var(--skip-bg)}
.num{font-family:var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;padding-top:2px}
.txt{min-width:0;overflow-wrap:anywhere}
.expect{color:var(--muted);font-size:.92rem}
.expect b{font-weight:500;color:var(--fg)}
.tag{display:inline-block;font-size:.76rem;border-radius:4px;padding:0 6px;margin-right:4px}
.tag.cost{background:var(--skip-bg);color:var(--skip)}
.tag.re{color:var(--accent);border:1px solid var(--accent)}
.acts{display:flex;gap:4px}
.acts button{padding:2px 8px;font-size:.85rem}
.acts button[data-v="ok"][aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--on-solid)}
.acts button[data-v="fail"][aria-pressed="true"]{background:var(--fail);border-color:var(--fail);color:var(--on-solid)}
.acts button[data-v="skip"][aria-pressed="true"]{background:var(--skip);border-color:var(--skip);color:var(--on-solid)}
.note{grid-column:2 / 4}
textarea{width:100%;min-height:2.2em;font:inherit;font-size:.9rem;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);padding:4px 8px;resize:vertical}
.tickets{display:grid;gap:12px}
.ticket{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;scroll-margin-top:90px}
.thead{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap;padding:12px 16px 4px}
.tid{font-family:var(--mono);font-weight:500;color:var(--accent)}
.ttitle{font-weight:600;flex:1 1 300px;min-width:0}
.goal{padding:0 16px 6px;color:var(--muted);max-width:75ch;margin:0}
.proof{padding:0 16px 8px;display:flex;flex-wrap:wrap;gap:4px 10px;font-family:var(--mono);font-size:.8rem;color:var(--muted)}
.proof .ok{color:var(--ok)} .proof .fail{color:var(--fail)} .proof .skip{color:var(--skip)}
details.dod{padding:0 16px 10px}
details.dod summary{cursor:pointer;color:var(--muted);font-size:.88rem}
details.dod ul{margin:6px 0 0;padding-left:20px}
.tfoot{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.tfoot .lbl{color:var(--muted);font-size:.88rem}
.tfoot textarea{flex:1 1 260px;min-width:0;width:auto}
.tfoot button[data-d="accept"][aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:var(--on-solid)}
.tfoot button[data-d="return"][aria-pressed="true"]{background:var(--fail);border-color:var(--fail);color:var(--on-solid)}
.need{color:var(--fail);font-size:.85rem}
.bnote{margin:6px 0 0}
.bnote label{display:block;color:var(--muted);font-size:.85rem;margin-bottom:4px}
@media (max-width:560px){.step{grid-template-columns:2em minmax(0,1fr)}.acts{grid-column:2}.note{grid-column:1 / 3}.mc{grid-template-columns:minmax(0,1fr) auto}.mc>.pill:first-child{display:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>


<div class="wrap">
  <header>
    <h1 id="h1"></h1>
    <p class="sub" id="sub"></p>
  </header>
  <div class="strip">
    <div class="bar" id="bar" aria-hidden="true"></div>
    <div class="counts" id="counts"></div>
    <span class="status" id="status"></span>
  </div>
  <div id="warn" class="warn" hidden></div>
  <nav class="blocks" id="blocks"></nav>
  <main id="main"></main>
</div>

<script id="data" type="application/json">__DATA__</script>
<script>
// State lives in db: results/<stepId> {status,note,round}, verdicts/<ticketId> {decision,note,round},
// notes/b<n> {note}. A mark made before the ticket's current round counts as open again:
// the work changed after it was looked at.
const DATA = JSON.parse(document.getElementById('data').textContent);
const STR = {
  ru: { connecting: 'Подключаюсь к хранилищу…', saving: 'Сохраняется', nosave: 'Без сохранения', saveFailed: 'Не сохранилось: ', store: 'Хранилище: ',
    warn: 'Хранилище недоступно: отметки не сохраняются. Откройте страницу на claude.ai под своим аккаунтом.', blocks: 'Блоки',
    stepsOk: 'шагов ок', no: 'нет', accepted: 'принято', toReturn: 'вернуть', block: 'Блок', decided: 'решено', steps: 'шагов',
    blockDone: 'Блок решён. Напиши Claude «посмотри приёмку»: возвраты уйдут в работу, принятые пойдут дальше.',
    setup: 'Подготовка, один раз', machine: 'Уже проверено машиной', scenario: 'Сценарий', tickets: 'Тикеты',
    passed: '✓ прошло', failed: '✗ упало', notRun: 'не запускалось', output: 'вывод', tokens: 'токены', again: '↻ заново после доработки',
    expect: 'Ожидается:', ok: '✓ ок', fail: '✗ нет', skip: 'пропуск', stepNote: 'Что увидел вместо ожидаемого?',
    test: 'тест', step: 'шаг', unproven: 'ни один шаг не проверяет этот тикет', round: 'круг', decideAgain: '↻ решить заново',
    changed: 'После доработки:', ticket: 'Тикет:', accept: 'Принять', ret: 'Вернуть',
    returnNote: 'Что доделать? Это станет пунктом DoD этого тикета.', comment: 'Комментарий (необязательно)', needReason: 'Нужна причина',
    blockNote: 'Заметка к блоку: всё, что не относится к одному шагу или тикету' },
  de: { connecting: 'Verbinde mit dem Speicher…', saving: 'Wird gespeichert', nosave: 'Ohne Speichern', saveFailed: 'Nicht gespeichert: ', store: 'Speicher: ',
    warn: 'Speicher nicht erreichbar: Markierungen werden nicht gespeichert. Seite auf claude.ai mit eigenem Konto öffnen.', blocks: 'Blöcke',
    stepsOk: 'Schritte ok', no: 'nein', accepted: 'angenommen', toReturn: 'zurück', block: 'Block', decided: 'entschieden', steps: 'Schritte',
    blockDone: 'Block entschieden. Schreib Claude „schau dir die Abnahme an“: Zurückgegebenes geht in Arbeit, Angenommenes weiter.',
    setup: 'Vorbereitung, einmal', machine: 'Schon maschinell geprüft', scenario: 'Ablauf', tickets: 'Tickets',
    passed: '✓ grün', failed: '✗ rot', notRun: 'nicht gelaufen', output: 'Ausgabe', tokens: 'Tokens', again: '↻ neu nach Nacharbeit',
    expect: 'Erwartet:', ok: '✓ ok', fail: '✗ nein', skip: 'übersprungen', stepNote: 'Was war stattdessen zu sehen?',
    test: 'Test', step: 'Schritt', unproven: 'kein Schritt prüft dieses Ticket', round: 'Runde', decideAgain: '↻ neu entscheiden',
    changed: 'Nach der Nacharbeit:', ticket: 'Ticket:', accept: 'Annehmen', ret: 'Zurück',
    returnNote: 'Was fehlt? Das wird ein DoD-Punkt dieses Tickets.', comment: 'Kommentar (optional)', needReason: 'Grund fehlt',
    blockNote: 'Bemerkung zum Block: alles, was nicht zu einem Schritt oder Ticket gehört' },
  en: { connecting: 'Connecting to storage…', saving: 'Saving', nosave: 'Not saving', saveFailed: 'Not saved: ', store: 'Storage: ',
    warn: 'Storage unavailable: marks are not saved. Open the page on claude.ai with your own account.', blocks: 'Blocks',
    stepsOk: 'steps ok', no: 'no', accepted: 'accepted', toReturn: 'return', block: 'Block', decided: 'decided', steps: 'steps',
    blockDone: 'Block decided. Tell Claude "read the acceptance": returns go back to work, accepted tickets move on.',
    setup: 'Setup, once', machine: 'Already checked by machine', scenario: 'Scenario', tickets: 'Tickets',
    passed: '✓ passed', failed: '✗ failed', notRun: 'not run', output: 'output', tokens: 'tokens', again: '↻ again after rework',
    expect: 'Expect:', ok: '✓ ok', fail: '✗ no', skip: 'skip', stepNote: 'What did you see instead?',
    test: 'test', step: 'step', unproven: 'no step checks this ticket', round: 'round', decideAgain: '↻ decide again',
    changed: 'After rework:', ticket: 'Ticket:', accept: 'Accept', ret: 'Return',
    returnNote: 'What is missing? This becomes a definition-of-done item of this ticket.', comment: 'Comment (optional)', needReason: 'Reason needed',
    blockNote: 'Note on this block: anything that belongs to no single step or ticket' },
};
const L = STR[DATA.lang] || STR.en;
const T = Object.fromEntries(DATA.tickets.map(t => [t.id, t]));
const results = {}, verdicts = {}, notes = {};
let db = null;
let block = (() => { try { return localStorage.getItem('acc-block') || String(DATA.blocks[0].n); } catch { return String(DATA.blocks[0].n); } })();

const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = s => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/(https?:\/\/[^\s,)<]+)/g, '<code>$1</code>');
const roundOf = ids => Math.max(1, ...ids.map(id => T[id]?.round || 1));
const allSteps = () => DATA.blocks.flatMap(b => b.steps);
const chip = id => `<a class="chip" href="#t-${esc(id)}">${esc(id)}</a>`;

function stepState(st){ const r = results[st.id]; if (!r?.status) return ''; return (r.round || 1) < roundOf(st.covers) ? '' : r.status; }
function stepStale(st){ const r = results[st.id]; return !!r?.status && (r.round || 1) < roundOf(st.covers); }
function verdict(id){ const v = verdicts[id]; if (!v?.decision) return ''; return (v.round || 1) < (T[id].round || 1) ? '' : v.decision; }
function blockDecided(b){ return b.tickets.filter(id => verdict(id)).length; }

function machineHtml(m){
  const p = m.status === 'pass' ? 'pass' : m.status === 'fail' ? 'fail' : 'pending';
  const label = p === 'pass' ? L.passed : p === 'fail' ? L.failed : L.notRun;
  return `<div class="mc"><span class="pill ${p}">${label}</span>
    <div class="txt"><code>${esc(m.cmd)}</code>${m.summary ? ` · ${esc(m.summary)}` : ''}<div class="chips">${m.covers.map(chip).join('')}</div></div>
    <span class="bp">${esc(m.ran_at || '')}</span>
    ${m.output ? `<details><summary class="status">${L.output}</summary><pre>${esc(m.output)}</pre></details>` : ''}</div>`;
}

function stepHtml(st, n){
  const cur = stepState(st), r = results[st.id] || {};
  const b = (v, label) => `<button data-k="${esc(st.id)}" data-v="${v}" aria-pressed="${cur===v}">${label}</button>`;
  return `<li class="step" data-s="${cur}"><span class="num">${n}</span>
    <div class="txt">${st.costly ? `<span class="tag cost">${L.tokens}</span>` : ''}${stepStale(st) ? `<span class="tag re">${L.again}</span>` : ''}${fmt(st.do)}
      ${st.expect ? `<div class="expect"><b>${L.expect}</b> ${fmt(st.expect)}</div>` : ''}
      <div class="chips">${st.covers.map(chip).join('')}</div></div>
    <div class="acts">${b('ok', L.ok)}${b('fail', L.fail)}${b('skip', L.skip)}</div>
    ${cur==='fail' || r.note ? `<div class="note"><textarea id="n-${esc(st.id)}" data-k="${esc(st.id)}" aria-label="${L.stepNote}" placeholder="${L.stepNote}">${esc(r.note)}</textarea></div>` : ''}</li>`;
}

function ticketHtml(id, b){
  const t = T[id], v = verdict(id), vn = verdicts[id]?.note || '';
  const steps = b.steps.map((s, i) => [s, i + 1]).filter(([s]) => s.covers.includes(id));
  const mcs = (b.machine || []).filter(m => m.covers.includes(id));
  const proof = [
    ...mcs.map(m => `<span class="${m.status === 'pass' ? 'ok' : m.status === 'fail' ? 'fail' : ''}">${m.status === 'pass' ? '✓' : m.status === 'fail' ? '✗' : '·'} ${L.test}</span>`),
    ...steps.map(([s, n]) => { const c = stepState(s); return `<span class="${c}">${c === 'ok' ? '✓' : c === 'fail' ? '✗' : c === 'skip' ? '–' : '·'} ${L.step} ${n}</span>`; })
  ].join('');
  const stale = verdicts[id]?.decision && !v;
  const ph = v === 'return' ? L.returnNote : L.comment;
  return `<section class="ticket" id="t-${esc(id)}">
    <div class="thead"><span class="tid">${esc(id)}</span><span class="ttitle">${esc(t.title)}</span>
      ${(t.round || 1) > 1 ? `<span class="tag re">${L.round} ${t.round}</span>` : ''}${stale ? `<span class="tag re">${L.decideAgain}</span>` : ''}</div>
    <p class="goal">${esc(t.goal)}</p>
    <div class="proof">${proof || L.unproven}</div>
    ${t.changed ? `<p class="goal"><b>${L.changed}</b> ${fmt(t.changed)}</p>` : ''}
    <details class="dod"><summary>Definition of Done (${t.dod.length})</summary><ul>${t.dod.map(x => `<li>${esc(x)}</li>`).join('')}</ul></details>
    <div class="tfoot"><span class="lbl">${L.ticket}</span>
      <button data-t="${esc(id)}" data-d="accept" aria-pressed="${v==='accept'}">${L.accept}</button>
      <button data-t="${esc(id)}" data-d="return" aria-pressed="${v==='return'}">${L.ret}</button>
      <textarea id="v-${esc(id)}" data-t="${esc(id)}" aria-label="${ph}" placeholder="${ph}">${esc(vn)}</textarea>
      ${v==='return' && !vn.trim() ? `<span class="need">${L.needReason}</span>` : ''}</div></section>`;
}

function render(){
  document.documentElement.lang = DATA.lang || 'en';
  document.getElementById('h1').textContent = DATA.title;
  document.getElementById('sub').innerHTML = fmt(DATA.subtitle || '');
  document.getElementById('warn').textContent = L.warn;
  document.getElementById('blocks').setAttribute('aria-label', L.blocks);
  const steps = allSteps(), done = { ok:0, fail:0, skip:0 };
  steps.forEach(s => { const c = stepState(s); if (c) done[c]++; });
  const pct = x => steps.length ? (x / steps.length * 100) + '%' : '0';
  document.getElementById('bar').innerHTML = `<i style="width:${pct(done.ok)};background:var(--ok)"></i><i style="width:${pct(done.fail)};background:var(--fail)"></i><i style="width:${pct(done.skip)};background:var(--skip)"></i>`;
  const acc = DATA.tickets.filter(t => verdict(t.id) === 'accept').length, ret = DATA.tickets.filter(t => verdict(t.id) === 'return').length;
  document.getElementById('counts').innerHTML = `<span><b>${done.ok}</b>/${steps.length} ${L.stepsOk}</span><span><b>${done.fail}</b> ${L.no}</span><span><b>${acc}</b>/${DATA.tickets.length} ${L.accepted}</span><span><b>${ret}</b> ${L.toReturn}</span>`;
  document.getElementById('blocks').innerHTML = DATA.blocks.map(b => { const d = blockDecided(b);
    return `<button data-b="${b.n}" data-done="${d === b.tickets.length ? 1 : 0}" aria-pressed="${block === String(b.n)}"><span class="bn">${b.n}</span>${esc(b.title)}<span class="bp">${d}/${b.tickets.length}</span></button>`; }).join('');
  const b = DATA.blocks.find(x => String(x.n) === block) || DATA.blocks[0];
  const d = blockDecided(b), bk = 'b' + b.n;
  document.getElementById('main').innerHTML = `
    <div class="bhead"><h2>${L.block} ${b.n} · ${esc(b.title)}</h2><span class="bp">${d}/${b.tickets.length} ${L.decided} · ${b.steps.length} ${L.steps}</span></div>
    ${b.hint ? `<p class="hint">${fmt(b.hint)}</p>` : ''}
    ${d === b.tickets.length ? `<div class="bdone">${L.blockDone}</div>` : ''}
    ${b.setup?.length ? `<h3>${L.setup}</h3><div class="panel"><ol class="setup">${b.setup.map(s => `<li>${fmt(s)}</li>`).join('')}</ol></div>` : ''}
    ${b.machine?.length ? `<h3>${L.machine}</h3><div class="panel">${b.machine.map(machineHtml).join('')}</div>` : ''}
    <h3>${L.scenario}</h3><div class="panel"><ol class="steps">${b.steps.map((s, i) => stepHtml(s, i + 1)).join('')}</ol></div>
    <h3>${L.tickets}</h3><div class="tickets">${b.tickets.map(id => ticketHtml(id, b)).join('')}</div>
    <div class="bnote"><label for="bn-${bk}">${L.blockNote}</label><textarea id="bn-${bk}" data-n="${bk}">${esc(notes[bk]?.note)}</textarea></div>`;
}

async function save(path, body){
  if (!db) return;
  try { await db.doc(path).set({ ...body, at: new Date().toISOString() }); }
  catch (e) { document.getElementById('status').textContent = L.saveFailed + (e?.message || e?.code || '?'); }
}

document.addEventListener('click', e => {
  const bb = e.target.closest('button[data-b]');
  if (bb){ block = bb.dataset.b; try { localStorage.setItem('acc-block', block); } catch {} render(); window.scrollTo(0, 0); return; }
  const s = e.target.closest('button[data-k]');
  if (s){ const st = allSteps().find(x => x.id === s.dataset.k), cur = results[st.id] || {};
    const v = stepState(st) === s.dataset.v ? '' : s.dataset.v;
    results[st.id] = { ...cur, status: v, round: roundOf(st.covers) }; render(); save('results/' + st.id, results[st.id]); return; }
  const d = e.target.closest('button[data-d]');
  if (d){ const id = d.dataset.t, cur = verdicts[id] || {}, v = verdict(id) === d.dataset.d ? '' : d.dataset.d;
    verdicts[id] = { ...cur, decision: v, round: T[id].round || 1 }; render(); save('verdicts/' + id, verdicts[id]);
    if (v === 'return') document.getElementById('v-' + id)?.focus(); }
});
const timers = {};
document.addEventListener('input', e => {
  const ta = e.target; if (ta.tagName !== 'TEXTAREA') return;
  const [col, key, store] = ta.dataset.k ? ['results', ta.dataset.k, results] : ta.dataset.t ? ['verdicts', ta.dataset.t, verdicts] : ['notes', ta.dataset.n, notes];
  store[key] = { ...(store[key] || {}), note: ta.value };
  clearTimeout(timers[col + key]);
  timers[col + key] = setTimeout(() => save(col + '/' + key, store[key]), 700);
});

document.getElementById('status').textContent = L.connecting;
render();
(async () => {
  db = window.claude ? await window.claude.use('db') : null;
  const status = document.getElementById('status');
  if (!db){ status.textContent = L.nosave; document.getElementById('warn').hidden = false; return; }
  status.textContent = L.saving;
  const listen = (col, store) => db.collection(col).onSnapshot(qs => {
    for (const k of Object.keys(store)) delete store[k];
    qs.docs.forEach(doc => { store[doc.id] = doc.data(); });
    if (document.activeElement?.tagName !== 'TEXTAREA') render();
  }, err => { status.textContent = L.store + (err?.code || '?'); });
  listen('results', results); listen('verdicts', verdicts); listen('notes', notes);
})();
</script>
