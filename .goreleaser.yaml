# Cross-platform release build.
#
# CGO is disabled everywhere on purpose: it is what keeps every artifact a single
# static binary with no runtime dependency, and what makes cross-compiling from a
# Linux box to macOS and Windows work with no extra toolchain.
version: 2

# No test run here: a release is tested once, by the release button
# (release-notes.yaml, "Test the cut tree"), on the tree this build is tagged
# from.
before:
  hooks:
    - go mod tidy
    # The Windows version resource - Properties > Details: company, product,
    # file version - plus an as-invoker manifest. go-winres writes
    # cmd/jaira/rsrc_windows_<arch>.syso from cmd/jaira/winres/winres.json,
    # and go build links a .syso only into the build whose GOOS/GOARCH its
    # name carries. An exe with neither is what Defender's ML heuristics
    # flag first (32TTSS). Numeric only: a snapshot's -SNAPSHOT suffix is no
    # Windows version.
    - go run github.com/tc-hib/go-winres@v0.3.3 make --in cmd/jaira/winres/winres.json --out cmd/jaira/rsrc --arch amd64,arm64 --file-version {{ .Major }}.{{ .Minor }}.{{ .Patch }}.0 --product-version {{ .Major }}.{{ .Minor }}.{{ .Patch }}.0
    # install.ps1 rides along as a release asset - the copy SignPath signed
    # when release.yaml's sign-windows job ran, the plain one otherwise.
    - sh scripts/signed-windows.sh stage

builds:
  - id: jaira
    main: ./cmd/jaira
    binary: jaira
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    hooks:
      # Swaps in the SignPath-signed jaira.exe when there is one (32TTSS);
      # every other target, and every build without ./signed, is untouched.
      post:
        - cmd: sh scripts/signed-windows.sh exe "{{ .Path }}" "{{ .Target }}"

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

checksum:
  name_template: checksums.txt

release:
  extra_files:
    - glob: ./dist-extra/install.ps1
  # SignPath Foundation signs the Windows files free of charge for open
  # source on condition that the download page says so.
  footer: |
    Free code signing provided by [SignPath.io](https://about.signpath.io), certificate by [SignPath Foundation](https://signpath.org).

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
      - '^chore:'
