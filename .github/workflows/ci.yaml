name: ci

# A change that touches nothing but core/release/notes/** runs no CI. That is
# the release pull request (release-notes.yaml moves the notes into
# notes/<version>/) and its merge into master: the button has already tested
# that exact tree, and testing it again on three platforms bought nothing.
# master has no required status checks, so a skipped run blocks no merge; if
# one is ever made required, replace paths-ignore with a job that ends green.
on:
  push:
    branches: [main, master]
    paths-ignore: ["core/release/notes/**"]
  pull_request:
    paths-ignore: ["core/release/notes/**"]

jobs:
  # A ticket file goes into a commit only together with code; a ticket nobody
  # works yet lives on its ref. See scripts/check-ticket-commits.sh for why.
  ticket-commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - run: scripts/check-ticket-commits.sh "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}"

  # The page 'jaira web' serves is committed as a build (core/web/ui/dist):
  # go:embed reads the disk and 'go install' has no Node. This rebuilds it from
  # the Svelte sources and fails when the committed build is not what they make.
  web-dist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: core/web/ui/package-lock.json
      - run: npm ci
        working-directory: core/web/ui
      - run: npm run build
        working-directory: core/web/ui
      - name: The committed build matches the sources
        run: |
          git add -N core/web/ui/dist
          git diff --exit-code -- core/web/ui/dist || {
            echo "::error::core/web/ui/dist is stale: run 'npm ci && npm run build' in core/web/ui and commit dist"
            exit 1
          }

  test:
    # Tested on all three platforms because the store touches the filesystem and
    # shells out to git, both of which differ across them. WSL2's file-watch
    # behaviour is not reproducible on a CI runner and is checked by hand.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26'
      - name: Configure git for fixture repositories
        run: |
          git config --global user.name jaira-ci
          git config --global user.email ci@example.invalid
      - run: go vet ./...
      - run: go test ./... -race
      - run: go build ./cmd/jaira
      # Cross-compiling for Windows on the Linux runner catches what breaks at
      # compile time — a build tag, a syscall, a package with no windows build
      # — in seconds, instead of eight minutes into the windows-latest job.
      # vet covers the test files too, which is where most of it has been.
      - name: Cross-check the Windows build
        if: matrix.os == 'ubuntu-latest'
        env:
          GOOS: windows
          GOARCH: amd64
        run: |
          go vet ./...
          go build ./cmd/jaira
